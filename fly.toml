# Fly.io config for the remote Garmin MCP server. See README, "Run it remotely".
app = "garmin-mcp-7d02ee"
primary_region = "arn"

[build]

[env]
  MCP_TRANSPORT = "http"
  DATA_DIR = "/data"
  PORT = "8080"
  # PUBLIC_URL defaults to https://<app>.fly.dev. Secrets (fly secrets set):
  # ALLOWED_EMAILS (Garmin emails that may sign in, comma separated).

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle and start on the next request: costs next to nothing when unused.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "60s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# OAuth state and the Garmin session live here, so they survive restarts and deploys.
[[mounts]]
  source = "garmin_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
