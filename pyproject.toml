[project]
name = "garmin-mcp"
version = "0.2.0"
description = "MCP server that gives Claude read-only access to your own Garmin Connect data."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "garminconnect>=0.3.20,<0.4",
    "curl_cffi>=0.17,<1",
    "python-dotenv>=1.0",
]

[tool.uv]
# A script-style project: install the dependencies, don't build a package.
package = false
